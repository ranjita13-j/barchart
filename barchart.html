<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Chart</title>
    <style>
        .container{
            font-family: Roboto;
            font-size: 10px;
            background-color:white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            
        }
       

        .sun{
            height: 30vh;
            background-color: aliceblue; 
            width: 50px;
            position: relative; 
          

        }
        .mon{
            height:50vh ;
            background-color: skyblue;
            width: 50px;
            position: relative;
            
           
        }
        .tue{
            height: 40vh;
            background-color: brown;
            width:50px ;
            position: relative;
            
            
           
           


        }
        .wed{
            height: 50vh;
            background-color: purple;
            width: 50px;
            position: relative;
         

        }
        .Days{
            display: flex;
            margin-top: 10px;
            color: #555;
            font-size: 13px;
            gap:20px;
            
        }
         
         
             .chart {
            height: 250px;
            display: flex;
            align-items: flex-end;
            justify-content: left;
            border-bottom: 2px solid #ccc;
            padding-top: 20px;
            gap: 20px;
        }
         span {
            position: absolute;
            top: -25px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }


        </style>
        </head>
        <body>
            <div class="container">
            
                <div class="chart">
                    <div class="sun"> <span>100</span></div>
                    <div class="mon"><span>110</span></div>
                    <div class="tue"> <span>120</span></div>
                    <div class="wed"> <span>130</span></div>
                </div>
                
                <div class="Days">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                </div>
                </div> 
        </body>
        </html>
