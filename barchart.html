
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Chart</title>

    <style>

        .chart-container {
            width: 400px;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .chart {
            height: 250px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            border-bottom: 2px solid #ccc;
            padding-top: 20px;
        }

        .bar {
            width: 45px;
            border-radius: 6px 6px 0 0;
            position: relative;
            transition: height 0.4s;
        }

       

        .bar span {
            position: absolute;
            top: -25px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }

        .month {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            color: #555;
            font-size: 13px;
        }

        .jan { height: 100px; background: #3498db; }
        .feb { height: 160px; background: #2ecc71; }
        .mar { height: 130px; background: #f39c12; }
        .apr { height: 210px; background: #9b59b6; }
    </style>
</head>

<body>

    <div class="chart-container">
        <h2>Monthly Sales</h2>

        <div class="chart">
            <div class="bar jan"> jan<span>100</span></div>
            <div class="bar feb"> Feb<span>160</span></div>
            <div class="bar mar"> March<span>130</span></div>
            <div class="bar apr"> April<span>210</span></div>
        </div>

      
    </div>

</body>
</html>
